<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | BizBridge</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">BizBridge</a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="register.html">Create account</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <section class="auth-card shadow-sm">
                    <div class="text-center mb-4">
                        <span class="badge text-bg-success mb-3">
                            Welcome back
                        </span>
                        <h1 class="h2 fw-bold">Log in to BizBridge</h1>
                        <p class="text-secondary">
                            Continue building your business readiness.
                        </p>
                    </div>

                    <div id="loginMessage"
                         class="alert d-none"
                         role="alert"
                         aria-live="polite"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email address
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-success btn-lg w-100">
                            Log In
                        </button>
                    </form>

                    <p class="text-center text-secondary mt-4 mb-0">
                        New to BizBridge?
                        <a href="register.html" class="text-success fw-semibold">
                            Create an account
                        </a>
                    </p>
                </section>
            </div>
        </div>
    </main>

    <script src="login.js"></script>
</body>
</html>
